name: 기능 요청
description: 새로운 기능이나 개선 사항을 제안합니다
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: background
    attributes:
      label: 배경 / 필요한 이유
      description: 어떤 문제를 해결하려는지 적어주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안 내용
      description: 원하는 동작이나 구현 방향을 적어주세요.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: 완료 조건
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 참고 사항 (선택)
