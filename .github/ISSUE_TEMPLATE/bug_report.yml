name: 버그 리포트
description: 동작하지 않거나 의도와 다르게 동작하는 문제를 신고합니다
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 문제 요약
      description: 어떤 문제가 발생했는지 간단히 적어주세요.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      description: 에러 메시지나 로그가 있다면 함께 붙여주세요.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: 심각도
      options:
        - 낮음 (사용에 지장 없음)
        - 보통 (우회 방법 있음)
        - 높음 (주요 기능 사용 불가)
        - 긴급 (서비스 장애)
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 환경
      placeholder: "예: Chrome 130, macOS, Node 22"
